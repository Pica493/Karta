const PlayerData = (() => {
  let player = null;
  let isLoaded = false;
  let saveTimeout = null;

  async function init(){
    if (isLoaded) return;
    try {
      const ysdk = await YaGames.init();
      if (ysdk && ysdk.getPlayer) {
        player = await ysdk.getPlayer({ scopes: false }); // Запрашиваем только базовый доступ
        isLoaded = true;
        console.log('Player data initialized');
      }
    } catch (e) {
      console.warn('Failed to init player data:', e);
    }
  }

  function scheduleSave(){
    if (saveTimeout) clearTimeout(saveTimeout);
    saveTimeout = setTimeout(() => {
      save();
    }, 2000); // Сохраняем не чаще раза в 2 секунды
  }

  async function save(){
    if (!player) return;
    try {
      const data = {
        records: localStorage.getItem('klondike_records_v1'),
        shop: localStorage.getItem('klondike_shop_v1'),
        hints: localStorage.getItem('klondike_hints_v1')
      };
      await player.setData(data, true);
      console.log('Data saved to cloud');
    } catch (e) {
      console.warn('Cloud save failed:', e);
    }
  }

  async function load(){
    if (!player) return;
    try {
      const data = await player.getData(['records', 'shop', 'hints']);
      if (data) {
        if (data.records) localStorage.setItem('klondike_records_v1', data.records);
        if (data.shop) localStorage.setItem('klondike_shop_v1', data.shop);
        if (data.hints) localStorage.setItem('klondike_hints_v1', data.hints);
        console.log('Data loaded from cloud');
        return true;
      }
    } catch (e) {
      console.warn('Cloud load failed:', e);
    }
    return false;
  }

  return { init, save: scheduleSave, load };
})();

/* ================================================================
   МАГАЗИН
   ================================================================ */
const Shop = (() => {
  const KEY = 'klondike_shop_v1';
  let state = {
    unlockedBg: ['classic'],
    unlockedBack: ['classic'],
    activeBg: 'classic',
    activeBack: 'classic'
  };
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === 'object') {
        state = { ...state, ...parsed };
      }
    }
  } catch(e){}
  // Валидация
  if (!Array.isArray(state.unlockedBg) || !state.unlockedBg.length) state.unlockedBg = ['classic'];
  if (!Array.isArray(state.unlockedBack) || !state.unlockedBack.length) state.unlockedBack = ['classic'];
  if (!state.unlockedBg.includes('classic')) state.unlockedBg.unshift('classic');
  if (!state.unlockedBack.includes('classic')) state.unlockedBack.unshift('classic');
  if (!state.unlockedBg.includes(state.activeBg)) state.activeBg = 'classic';
  if (!state.unlockedBack.includes(state.activeBack)) state.activeBack = 'classic';

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); PlayerData.save(); } catch(e){} }

  function apply(){
    const bg = BACKGROUNDS.find(b => b.id === state.activeBg) || BACKGROUNDS[0];
    const back = CARD_BACKS.find(b => b.id === state.activeBack) || CARD_BACKS[0];
    document.documentElement.style.setProperty('--table-bg', bg.bg);
    document.documentElement.style.setProperty('--card-back-base', back.base);
    document.documentElement.style.setProperty('--card-back-accent', back.accent);
    document.documentElement.style.setProperty('--card-back-pattern', back.pattern);
  }

  return {
    get state(){ return state; },
    backgrounds: BACKGROUNDS,
    cardBacks: CARD_BACKS,
    isBgUnlocked(id){ return state.unlockedBg.includes(id); },
    isBackUnlocked(id){ return state.unlockedBack.includes(id); },
    getActiveBg(){ return state.activeBg; },
    getActiveBack(){ return state.activeBack; },
    selectBg(id){
      if (!this.isBgUnlocked(id)) return false;
      state.activeBg = id; save(); apply(); return true;
    },
    selectBack(id){
      if (!this.isBackUnlocked(id)) return false;
      state.activeBack = id; save(); apply(); return true;
    },
    unlockBg(id){
      if (!state.unlockedBg.includes(id)) state.unlockedBg.push(id);
      state.activeBg = id;
      save(); apply();
    },
    unlockBack(id){
      if (!state.unlockedBack.includes(id)) state.unlockedBack.push(id);
      state.activeBack = id;
      save(); apply();
    },
    apply
  };
})();

function measureCssVar(name, fallback){
  try {
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;width:' + name + ';height:0;';
    document.body.appendChild(probe);
    const w = probe.getBoundingClientRect().width;
    probe.remove();
    return w > 0 ? w : fallback;
  } catch(e) { return fallback; }
}
function getOverlaps(){
  const cardW = measureCssVar('--card-w', 80);
  const cardH = measureCssVar('--card-h', 112);
  const portrait = window.innerHeight > window.innerWidth;
  return {
    up: Math.round(cardH * (portrait ? 0.22 : 0.25)),
    down: Math.round(cardH * (portrait ? 0.12 : 0.11)),
    waste: Math.round(cardW * (portrait ? 0.30 : 0.22))
  };
}
function formatTime(s){
  const m = Math.floor(s / 60);
  const sec = s % 60;
  return `${m}:${sec.toString().padStart(2,'0')}`;
}

const Records = (() => {

  let data = { easy: [], standard: [], hard: [] };
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === 'object') {
        data = {
          easy: Array.isArray(parsed.easy) ? parsed.easy : [],
          standard: Array.isArray(parsed.standard) ? parsed.standard : [],
          hard: Array.isArray(parsed.hard) ? parsed.hard : []
        };
      }
    }
  } catch(e) {}
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(data)); PlayerData.save(); } catch(e) {} }
  return {
    getTop(difficulty){ return (data[difficulty] || []).slice(); },
    addRecord(difficulty, timeSec, movesCount){
      if (!data[difficulty]) data[difficulty] = [];
      const rec = { time: timeSec, moves: movesCount, date: new Date().toISOString().slice(0,10) };
      const arr = data[difficulty];
      arr.push(rec);
      arr.sort((a, b) => a.time - b.time);
      data[difficulty] = arr.slice(0, MAX_RECORDS_PER_DIFFICULTY);
      save();
      return data[difficulty].indexOf(rec) >= 0;
    }
  };
})();

const Hints = (() => {
  const KEY = 'klondike_hints_v1';
  let state = { count: FREE_HINTS_PER_DAY, lastReset: new Date().toISOString().slice(0,10), lastRewardedAdTime: 0 };
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed && typeof parsed === 'object') state = { ...state, ...parsed };
    }
  } catch(e){}
  const today = new Date().toISOString().slice(0,10);
  if (state.lastReset !== today) {
    state.count = FREE_HINTS_PER_DAY;
    state.lastReset = today;
    save();
  }
  function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); PlayerData.save(); } catch(e) {} }
  return {
    get count(){ return state.count; },
    canWatchAd(){ return (Date.now() - state.lastRewardedAdTime) >= HINT_REWARD_COOLDOWN_MS; },
    cooldownRemaining(){
      const diff = HINT_REWARD_COOLDOWN_MS - (Date.now() - state.lastRewardedAdTime);
      return Math.max(0, diff);
    },
    spend(){
      if (state.count <= 0) return false;
      state.count--;
      save();
      updateHintButton();
      return true;
    },
    grantFromAd(){
      state.count++;
      state.lastRewardedAdTime = Date.now();
      save();
      updateHintButton();
    }
  };
})();

  function updateDifficultyUI(){
    const d = DIFFICULTIES[current.difficulty] || DIFFICULTIES.standard;

      });

      drawBtns.forEach(b => {

        b.disabled = false;
      });
      if (drawHint) drawHint.textContent = 'Свободный выбор';
    }

    if (disp) disp.textContent = d.shortLabel;
  }
  return {
    get musicVolume(){ return current.musicVolume; },
    get sfxVolume(){ return current.sfxVolume; },
    get drawMode(){ return current.drawMode; },
    get difficulty(){ return current.difficulty; },
    get maxHistory(){ return (DIFFICULTIES[current.difficulty] || DIFFICULTIES.standard).maxHistory; },
    setMusicVolume(v){
      current.musicVolume = Math.max(0, Math.min(100, parseInt(v) || 0));

      if (el) el.textContent = current.musicVolume + '%';
      save();
      AudioManager.setMusicVolume(current.musicVolume / 100);
    },
    setSfxVolume(v){
      current.sfxVolume = Math.max(0, Math.min(100, parseInt(v) || 0));
      const el = document.getElementById('sfxVolumeVal');
      if (el) el.textContent = current.sfxVolume + '%';
      save();
      AudioManager.setSfxVolume(current.sfxVolume / 100);
    },
    setDrawMode(mode){
      if (mode !== 1 && mode !== 3) return;
      const d = DIFFICULTIES[current.difficulty] || DIFFICULTIES.standard;
      if (d.forceDrawMode !== null) return;
      current.drawMode = mode;
      document.querySelectorAll('#drawModeToggle .toggle-btn').forEach(b => {

      });

/* ================================================================
   YANDEX GAMES SDK
   ================================================================ */
const YandexGames = (() => {
  let ysdk = null, initStarted = false, isPausedByPlatform = false, gameStartCount = 0;
  const SHOW_EVERY = 3;
  let isRewardedVideoLoading = false; // Блокировка для предотвращения одновременных вызовов

  async function init(){
    if (initStarted) return;
    initStarted = true;
    try {
      await loadScript('https://sdk.games.s3.yandex.net/sdk.js');
      if (typeof YaGames === 'undefined') throw new Error('no YaGames');
      ysdk = await YaGames.init();
      setupListeners();
      if (ysdk.features && ysdk.features.LoadingAPI) {
        try { ysdk.features.LoadingAPI.ready(); } catch(e){}
      }
    } catch(err){ ysdk = null; }
  }

  function loadScript(src){
    return new Promise((resolve, reject) => {
      if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src; s.async = true;
      s.onload = () => resolve();
      s.onerror = () => reject(new Error('SDK error'));
      document.head.appendChild(s);
      setTimeout(() => reject(new Error('SDK timeout')), 6000);
    });
  }

  function setupListeners(){
    if (!ysdk || typeof ysdk.on !== 'function') return;
    try {
      ysdk.on('game_api_pause', () => {
        isPausedByPlatform = true;
        AudioManager.pauseAll();
        Game.pauseGame();
      });
      ysdk.on('game_api_resume', () => {
        isPausedByPlatform = false;
        AudioManager.resumeAll();
        Game.resumeGame();
      });
    } catch(e){}
  }

  function showFullscreenAd(){
    if (!ysdk || !ysdk.adv) return;
    AudioManager.pauseAll(); Game.pauseGame();
    let done = false;
    const finish = () => {
      if (done) return; done = true;
      if (!isPausedByPlatform) { AudioManager.resumeAll(); Game.resumeGame(); }
    };
    try {
      ysdk.adv.showFullscreenAdv({ callbacks: { onClose: finish, onError: finish } });
      setTimeout(finish, 60000); // Таймаут на случай зависания
    } catch(e){ finish(); }
  }

  /**
   * Показ rewarded-видео РСЯ с блокировкой.
   * onReward — вызывается ТОЛЬКО при onRewarded.
   * onFinish — вызывается всегда (для сброса состояния UI).
   */
  function showRewardedVideo(onReward, onFinish){
    // Если SDK недоступен или уже идет загрузка — ничего не делаем
    if (!ysdk || !ysdk.adv || isRewardedVideoLoading) {
      if (onFinish) onFinish();
      return;
    }
    isRewardedVideoLoading = true; // Устанавливаем блокировку

    AudioManager.pauseAll(); Game.pauseGame();
    let rewarded = false;
    let finished = false;

    const finalize = () => {
      if (finished) return; finished = true;
      isRewardedVideoLoading = false; // Снимаем блокировку
      if (!isPausedByPlatform) { AudioManager.resumeAll(); Game.resumeGame(); }
      if (onFinish) onFinish();
    };

    try {
      ysdk.adv.showRewardedVideo({
        callbacks: {
          onOpen: () => {},
          onRewarded: () => {
            rewarded = true;
            if (onReward) onReward();
          },
          onClose: finalize,
          onError: finalize
        }
      });
      // Защита от «зависания» callback'ов
      setTimeout(() => {
        if (!finished && !rewarded) finalize();
      }, 120000);
    } catch(e){
      finalize();
    }
  }

  function onGameStarted(){
    gameStartCount++;
    if (gameStartCount > 1 && gameStartCount % SHOW_EVERY === 0) {
      setTimeout(showFullscreenAd, 1500);
    }
  }

  return { init, showFullscreenAd, showRewardedVideo, onGameStarted };
})();

const AudioManager = (() => {
  let ctx = null, musicGain = null, sfxGain = null;
  let musicLfo = null, melodyInterval = null;
  let musicPlaying = false, paused = false;
  let currentMusicStep = 0;

  function init(){
    if (ctx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      musicGain = ctx.createGain();
      sfxGain = ctx.createGain();
      musicGain.connect(ctx.destination);
      sfxGain.connect(ctx.destination);
      musicGain.gain.value = Settings.musicVolume / 100 * 0.12;
      sfxGain.gain.value = Settings.sfxVolume / 100 * 0.3;
    } catch(e) { ctx = null; }
  }

  function ensureCtx(){
    init();
    if (ctx && ctx.state === 'suspended' && !paused) ctx.resume().catch(() => {});
  }

  const MELODY = [60, 64, 67, 72, 71, 67, 64, 67, 69, 72, 76, 72, 69, 67, 64, 62];
  const BASS = [36, 36, 43, 36, 41, 41, 43, 36];
  function midiToFreq(m){ return 440 * Math.pow(2, (m - 69) / 12); }

  function scheduleMelody(){
    if (!ctx || paused) return;
    const t = ctx.currentTime;
    const noteIdx = currentMusicStep % MELODY.length;
    const freq = midiToFreq(MELODY[noteIdx]);
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.06, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
    osc.connect(g); g.connect(musicGain);
    osc.start(t); osc.stop(t + 0.9);

    if (currentMusicStep % 2 === 0) {
      const bassIdx = Math.floor(currentMusicStep / 2) % BASS.length;
      const bfreq = midiToFreq(BASS[bassIdx]);
      const bosc = ctx.createOscillator();
      const bg = ctx.createGain();
      bosc.type = 'sine';
      bosc.frequency.value = bfreq;
      bg.gain.setValueAtTime(0.0001, t);
      bg.gain.exponentialRampToValueAtTime(0.05, t + 0.04);
      bg.gain.exponentialRampToValueAtTime(0.0001, t + 1.7);
      bosc.connect(bg); bg.connect(musicGain);
      bosc.start(t); bosc.stop(t + 1.8);
    }
    currentMusicStep++;
  }

  function startMusic(){
    ensureCtx();
    if (!ctx || musicPlaying) return;
    musicPlaying = true; paused = false;
    currentMusicStep = 0;
    scheduleMelody();
    melodyInterval = setInterval(scheduleMelody, 900);
  }

  function stopMusic(){
    if (!ctx || !musicPlaying) return;
    musicPlaying = false; paused = false;
    if (melodyInterval) { clearInterval(melodyInterval); melodyInterval = null; }
    if (musicLfo) { try { musicLfo.stop(); } catch(e){} musicLfo = null; }
  }

  function pauseAll(){
    if (!ctx || paused) return;
    paused = true;
    try {
      if (musicGain) musicGain.gain.setValueAtTime(0, ctx.currentTime);
      if (sfxGain) sfxGain.gain.setValueAtTime(0, ctx.currentTime);
      if (ctx.state === 'running') ctx.suspend().catch(() => {});
    } catch(e){}
  }

  function resumeAll(){
    if (!ctx) return;
    paused = false;
    try {
      if (ctx.state === 'suspended') ctx.resume().catch(() => {});
      if (musicGain) musicGain.gain.setValueAtTime(Settings.musicVolume / 100 * 0.12, ctx.currentTime);
      if (sfxGain) sfxGain.gain.setValueAtTime(Settings.sfxVolume / 100 * 0.3, ctx.currentTime);
    } catch(e){}
  }

  function playTone(freq, dur, type, vol, delay){
    if (paused) return;
    ensureCtx();
    if (!ctx) return;
    try {
      const t = ctx.currentTime + (delay || 0);
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type || 'sine';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.3 * (vol || 1), t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(g); g.connect(sfxGain);
      osc.start(t); osc.stop(t + dur + 0.05);
    } catch(e){}
  }

  function playNoise(dur, vol){
    if (paused) return;
    ensureCtx();
    if (!ctx) return;
    try {
      const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * dur));
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const g = ctx.createGain();
      g.gain.value = 0.15 * (vol || 1);
      const filter = ctx.createBiquadFilter();
      filter.type = 'highpass';
      filter.frequency.value = 2000;
      src.connect(filter); filter.connect(g); g.connect(sfxGain);
      src.start();
    } catch(e){}
  }

  return {
    init, startMusic, stopMusic, pauseAll, resumeAll,
    playFlip(){ playTone(700,0.06,'triangle',0.4); playNoise(0.05,0.4); },
    playMove(){ playTone(450,0.08,'sine',0.5); playNoise(0.04,0.3); },
    playFoundation(){ playTone(523.25,0.12,'sine',0.6); playTone(659.25,0.12,'sine',0.5,0.05); playTone(783.99,0.18,'sine',0.4,0.1); },
    playWin(){ [523.25,659.25,783.99,1046.50,1318.51].forEach((f,i) => setTimeout(() => playTone(f,0.4,'sine',0.6), i*130)); },
    playLose(){ [392,349.23,293.66,220].forEach((f,i) => setTimeout(() => playTone(f,0.5,'sine',0.5), i*180)); },
    playInvalid(){ playTone(180,0.12,'sawtooth',0.15); },
    playClick(){ playTone(1200,0.04,'sine',0.3); },
    playHint(){ playTone(880,0.1,'sine',0.5); playTone(1320,0.15,'sine',0.4,0.08); },
    playDeal(){ for (let i = 0; i < 7; i++) setTimeout(() => { playTone(600 + Math.random()*200,0.05,'triangle',0.25); playNoise(0.03,0.2); }, i*60); },
    playUnlock(){ playTone(659.25,0.15,'sine',0.6); playTone(783.99,0.15,'sine',0.5,0.1); playTone(1046.50,0.3,'sine',0.6,0.2); },
    setMusicVolume(v){ ensureCtx(); if (musicGain && !paused) musicGain.gain.value = v * 0.12; },
    setSfxVolume(v){ ensureCtx(); if (sfxGain && !paused) sfxGain.gain.value = v * 0.3; }
  };
})();

/* ================================================================
   МОДЕЛЬ КАРТЫ
   ================================================================ */
class Card {
  constructor(suit, rank, faceUp = false){
    this.suit = suit;
    this.rank = rank;
    this.faceUp = faceUp;
    this.id = suit + rank + Math.random().toString(36).slice(2, 7);
  }
  get color(){ return SUIT_COLORS[this.suit]; }
  get value(){ return RANK_VALUES[this.rank]; }
  canPlaceOn(other){
    if (!other || !other.faceUp) return false;
    return this.value === other.value - 1 && this.color !== other.color;
  }
  canPlaceOnFoundation(pile){
    if (!pile.length) return this.rank === 'A';
    const top = pile[pile.length - 1];
    return top.suit === this.suit && this.value === top.value + 1;
  }
  toJSON(){ return { suit: this.suit, rank: this.rank, faceUp: this.faceUp }; }
}

const Game = (() => {
  let stock = [], waste = [];
  let foundations = [[],[],[],[]];
  let tableau = [[],[],[],[],[],[],[]];
  let history = [];
  let timerInterval = null;
  let seconds = 0, moves = 0;
  let isGameActive = false, isPaused = false;
  let suppressNextClick = false;
  let deadCheckTimeout = null;
  let hintTimeout = null;
  let lastMove = null;
  let pingPongCount = 0;
  const stateHashes = [];
  const drag = {
    active: false, started: false,
    cards: [], source: null,
    startX: 0, startY: 0, offsetX: 0, offsetY: 0,
    pointerId: null, ghost: null
  };

  function updateStats(){
    const t = document.getElementById('timerDisplay');
    const m = document.getElementById('movesDisplay');
    if (t) t.textContent = formatTime(seconds);
    if (m) m.textContent = moves;
  }
  function startTimer(){
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      if (isGameActive && !isPaused) { seconds++; updateStats(); }
    }, 1000);
  }
  function stopTimer(){
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
  }
  function createDeck(){
    const d = [];
    for (const s of SUITS) for (const r of RANKS) d.push(new Card(s, r));
    for (let i = d.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [d[i], d[j]] = [d[j], d[i]];
    }
    return d;
  }
  function deal(){
    const deck = createDeck();
    stock = []; waste = [];
    foundations = [[],[],[],[]];
    tableau = [[],[],[],[],[],[],[]];
    let idx = 0;
    for (let col = 0; col < 7; col++) {
      for (let row = 0; row <= col; row++) {
        const c = deck[idx++];
        c.faceUp = (row === col);
        tableau[col].push(c);
      }
    }
    while (idx < deck.length) {
      const c = deck[idx++];
      c.faceUp = false;
      stock.push(c);
    }
  }

  function render(){
    renderStock(); renderWaste(); renderFoundations(); renderTableau();
    updateStats(); updateUndoButton();
  }
  function renderStock(){
    const slot = document.getElementById('stockSlot');
    if (!slot) return;
    slot.innerHTML = '';
    slot.classList.toggle('empty', stock.length === 0);
    if (stock.length > 0) {
      const back = document.createElement('div');
      back.className = 'card-back-mini';
      slot.appendChild(back);
      const cnt = document.createElement('span');
      cnt.className = 'stock-count';
      cnt.textContent = stock.length;
      slot.appendChild(cnt);
    }
  }
  function renderWaste(){
    const slot = document.getElementById('wasteSlot');
    if (!slot) return;
    const ov = getOverlaps();
    slot.innerHTML = '';
    slot.style.width = 'calc(var(--card-w) + ' + (ov.waste * 2) + 'px)';
    const show = Math.min(waste.length, 3);
    const start = waste.length - show;
    for (let i = 0; i < show; i++) {
      const card = waste[start + i];
      card.faceUp = true;
      const isTop = (i === show - 1);
      const el = createCardElement(card, { interactive: isTop });
      el.style.left = (i * ov.waste) + 'px';
      el.style.zIndex = i;
      if (!isTop) el.style.pointerEvents = 'none';
      slot.appendChild(el);
    }
  }
  function renderFoundations(){
    const container = document.getElementById('foundations');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const slot = document.createElement('div');
      slot.className = 'slot foundation-slot';
      slot.dataset.foundation = i;
      const wm = document.createElement('div');
      wm.className = 'suit-watermark';
      wm.textContent = SUITS[i];
      slot.appendChild(wm);
      if (foundations[i].length) {
        const card = foundations[i][foundations[i].length - 1];
        card.faceUp = true;
        const el = createCardElement(card, { interactive: false, forceFaceUp: true });
        slot.appendChild(el);
      }
      container.appendChild(slot);
    }
  }
  function renderTableau(){
    const container = document.getElementById('tableau');
    if (!container) return;
    const ov = getOverlaps();
    container.innerHTML = '';
    for (let col = 0; col < 7; col++) {
      const colEl = document.createElement('div');
      colEl.className = 'tableau-col';
      colEl.dataset.col = col;
      const pile = tableau[col];
      if (!pile.length) {
        const empty = document.createElement('div');
        empty.className = 'slot-empty';
        colEl.appendChild(empty);
      } else {
        let top = 0;
        for (let i = 0; i < pile.length; i++) {
          const card = pile[i];

      }
    }
    for (let col = 0; col < 7; col++) {
      const pile = tableau[col];
      if (!pile.length) continue;
      let firstFaceUp = -1;
      for (let i = 0; i < pile.length; i++) if (pile[i].faceUp) { firstFaceUp = i; break; }
      if (firstFaceUp < 0) continue;
      const top = pile[firstFaceUp];
      for (let t = 0; t < 7; t++) {
        if (t === col) continue;
        const tPile = tableau[t];
        if (tPile.length === 0) {
          if (top.rank === 'K' && (firstFaceUp > 0 || (pile.length - firstFaceUp) > 1)) {
            return { cardIds: pile.slice(firstFaceUp).map(c => c.id), target: { type: 'tableau', index: t } };
          }
        } else if (top.canPlaceOn(tPile[tPile.length - 1])) {
          return { cardIds: pile.slice(firstFaceUp).map(c => c.id), target: { type: 'tableau', index: t } };
        }
      }
    }
    return null;
  }
  function showHint(){
    if (!isGameActive || isPaused || drag.active) return;
    clearHint();
    const hint = findHint();
    if (!hint) { AudioManager.playInvalid(); return; }
    hint.cardIds.forEach(id => {
      const el = document.querySelector('.card[data-card-id="' + id + '"]');
      if (el) el.classList.add('hint-source');
    });
    if (hint.target.type === 'foundation') {
      const fSlot = document.querySelector('.foundation-slot[data-foundation="' + hint.target.index + '"]');
      if (fSlot) fSlot.classList.add('hint-target');
    } else if (hint.target.type === 'tableau') {
      const tCol = document.querySelector('.tableau-col[data-col="' + hint.target.index + '"]');
      if (tCol) {
        const lastCard = tCol.querySelector('.card:last-child');
        if (lastCard && !lastCard.classList.contains('hint-source')) lastCard.classList.add('hint-target');
        else {
          const se = tCol.querySelector('.slot-empty');
          if (se) se.classList.add('hint-target');
        }
      }
    }
    hintTimeout = setTimeout(clearHint, 2200);
  }
  function useHint(){
    if (!isGameActive || isPaused || drag.active) return;
    if (Hints.count <= 0) { UI.showHintModal(); return; }
    Hints.spend();
    AudioManager.playHint();
    showHint();
  }
  function newGame(){
    clearDeadCheck();
    clearHint();
    history = [];
    seconds = 0; moves = 0;
    isGameActive = true; isPaused = false;
    cleanupDrag();
    suppressNextClick = false;
    resetLoopTracking();
    deal();
    render();
    startTimer();
    AudioManager.startMusic();
    AudioManager.playDeal();
    const mo = document.getElementById('menuOverlay'); if (mo) mo.classList.add('hidden');
    const gr = document.getElementById('game-root'); if (gr) gr.style.display = 'flex';
    const wo = document.getElementById('winOverlay'); if (wo) wo.classList.remove('active');
    const dor = document.getElementById('deadOverlay'); if (dor) dor.classList.remove('active');
    const nr = document.getElementById('newRecordWrap'); if (nr) nr.style.display = 'none';
    updateHintButton();
    YandexGames.onGameStarted();
  }
  function pauseGame(){ isPaused = true; clearDeadCheck(); }
  function resumeGame(){ isPaused = false; }
  function rerender(){
    cleanupDrag();
    if (isGameActive) render();
  }
  function init(){
    Settings.applyToUI();
    updateHintButton();
    const stockSlot = document.getElementById('stockSlot');
    if (stockSlot) stockSlot.addEventListener('click', drawFromStock);
    const undoBtn = document.getElementById('undoBtn');
    if (undoBtn) undoBtn.addEventListener('click', undo);
    const hintBtn = document.getElementById('hintBtn');
    if (hintBtn) hintBtn.addEventListener('click', useHint);
  }
  return {
    init, newGame, drawFromStock, undo, rerender, useHint,
    pauseGame, resumeGame,
    get isActive(){ return isGameActive; }
  };
})();

/* ================================================================
   UI
   ================================================================ */
const UI = {
  showRules(){ AudioManager.playClick(); const m = document.getElementById('rulesModal'); if (m) m.classList.add('active'); },
  showSettings(){
    AudioManager.playClick();
    const m = document.getElementById('settingsModal'); if (m) m.classList.add('active');
    Settings.applyToUI();
  },
  showRecords(diff){
    AudioManager.playClick();
    const m = document.getElementById('recordsModal'); if (m) m.classList.add('active');
    RecordsUI.render(diff || Settings.difficulty);
  },
  showShop(){
    AudioManager.playClick();
    const m = document.getElementById('shopModal'); if (m) m.classList.add('active');
    ShopUI.render();
  },
  showHintModal(){
    AudioManager.playClick();
    const m = document.getElementById('hintModal'); if (m) m.classList.add('active');
    UI.updateHintModal();
    UI.startHintCooldownTick();
  },
  updateHintModal(){
    const cnt = document.getElementById('hintModalCount');
    if (cnt) cnt.textContent = Hints.count;
    const btn = document.getElementById('hintWatchAdBtn');
    const cdMsg = document.getElementById('hintCooldownMsg');
    const cdEl = document.getElementById('hintCooldown');
    if (!btn || !cdMsg || !cdEl) return;
    const remaining = Hints.cooldownRemaining();
    if (remaining > 0) {
      btn.disabled = true;
      btn.textContent = '▶ Реклама недоступна';
      cdMsg.style.display = 'block';
      const sec = Math.ceil(remaining / 1000);
      cdEl.textContent = formatTime(sec);
    } else {
      btn.disabled = false;
      btn.textContent = '▶ Смотреть рекламу';
      cdMsg.style.display = 'none';
    }
  },
  closeModal(id){
    AudioManager.playClick();
    const m = document.getElementById(id); if (m) m.classList.remove('active');
    if (id === 'hintModal' && UI._hintTimer) { clearInterval(UI._hintTimer); UI._hintTimer = null; }
  },
  goToMenu(){
    AudioManager.playClick();
    document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
    if (UI._hintTimer) { clearInterval(UI._hintTimer); UI._hintTimer = null; }
    if (Game.isActive) Game.pauseGame();
    document.getElementById('menuOverlay').classList.remove('hidden');
    document.getElementById('game-root').style.display = 'none';
    document.getElementById('winOverlay').classList.remove('active');
    document.getElementById('deadOverlay').classList.remove('active');
    AudioManager.stopMusic();
  },
  exitGame(){ AudioManager.playClick(); try { window.close(); } catch(e){} location.reload(); },
  showWinScreen(){ const w = document.getElementById('winOverlay'); if (w) w.classList.add('active'); },
  hideWinScreen(){ const w = document.getElementById('winOverlay'); if (w) w.classList.remove('active'); },
  showDeadScreen(){ const d = document.getElementById('deadOverlay'); if (d) d.classList.add('active'); },
  hideDeadScreen(){ const d = document.getElementById('deadOverlay'); if (d) d.classList.remove('active'); },
  _hintTimer: null,
  startHintCooldownTick(){
    if (UI._hintTimer) clearInterval(UI._hintTimer);
    UI._hintTimer = setInterval(() => {
      const modal = document.getElementById('hintModal');
      if (!modal || !modal.classList.contains('active')) {
        clearInterval(UI._hintTimer); UI._hintTimer = null; return;
      }
      UI.updateHintModal();
    }, 1000);
  }
};

/* ================================================================
   UI РЕКОРДОВ
   ================================================================ */
const RecordsUI = {
  currentDiff: 'standard',
  render(diff){
    this.currentDiff = diff;
    document.querySelectorAll('#recordsTabs .tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.diff === diff);
    });
    const content = document.getElementById('recordsContent');
    if (!content) return;
    const list = Records.getTop(diff);
    if (!list.length) {
      content.innerHTML = '<div class="record-empty">Пока нет рекордов.<br>Сыграйте и победите, чтобы установить первый!</div>';
      return;
    }
    let html = '';
    list.forEach((r, i) => {
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      html += '<div class="record-row ' + rankClass + '">' +
        '<span class="record-rank">' + (i + 1) + '</span>' +
        '<span class="record-time">' + formatTime(r.time) + '</span>' +
        '<span class="record-moves">' + r.moves + ' ходов</span>' +
        '<span class="record-date">' + (r.date || '') + '</span>' +
        '</div>';
    });
    content.innerHTML = html;
  }
};

/* ================================================================
   UI МАГАЗИНА
   ================================================================ */
const ShopUI = {
  currentTab: 'bg',
  render(tab){
    if (tab) this.currentTab = tab;
    document.querySelectorAll('#shopTabs .tab-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.tab === this.currentTab);
    });
    const grid = document.getElementById('shopGrid');
    if (!grid) return;
    const isBg = this.currentTab === 'bg';
    const items = isBg ? Shop.backgrounds : Shop.cardBacks;
    const activeId = isBg ? Shop.getActiveBg() : Shop.getActiveBack();
    let html = '';
    items.forEach(item => {
      const unlocked = isBg ? Shop.isBgUnlocked(item.id) : Shop.isBackUnlocked(item.id);
      const isActive = activeId === item.id;
      let preview;
      if (isBg) {
        preview = '<div class="shop-preview" style="background:' + item.bg + '"></div>';
      } else {
        preview = '<div class="shop-preview shop-preview-back" style="background:' + item.base + '">' +
                  '<div class="shop-preview-inner" style="background:' + item.pattern + ';border:1px solid ' + item.accent + '"></div>' +
                  '</div>';
      }
      const cls = 'shop-item' + (isActive ? ' selected' : '') + (unlocked ? '' : ' locked');
      html += '<div class="' + cls + '" data-id="' + item.id + '">' +
              preview +
              '<div class="shop-name">' + item.name + '</div>' +
              (!unlocked ? '<div class="shop-price">▶ Реклама</div>' : '') +
              (!unlocked ? '<div class="shop-lock">🔒</div>' : '') +
              (isActive ? '<div class="shop-active">✓</div>' : '') +
              '</div>';
    });
    grid.innerHTML = html;
    grid.querySelectorAll('.shop-item').forEach(el => {
      el.addEventListener('click', () => this.onItemClick(el.dataset.id));
    });
  },
  onItemClick(id){
    const isBg = this.currentTab === 'bg';
    const unlocked = isBg ? Shop.isBgUnlocked(id) : Shop.isBackUnlocked(id);
    if (unlocked) {
      AudioManager.playClick();
      if (isBg) Shop.selectBg(id); else Shop.selectBack(id);
      this.render();
      return;
    }
    // Открыть за рекламу
    AudioManager.playClick();
    const item = (isBg ? Shop.backgrounds : Shop.cardBacks).find(x => x.id === id);
    if (!item) return;
    const el = document.querySelector('.shop-item[data-id="' + id + '"]');
    if (el) el.classList.add('loading');
    YandexGames.showRewardedVideo(
      () => {
        // Успех — открываем и сразу применяем
        if (isBg) Shop.unlockBg(id); else Shop.unlockBack(id);
        AudioManager.playUnlock();
        if (el) el.classList.remove('loading');
        this.render();
      },
      () => {
        if (el) el.classList.remove('loading');
      }
    );
  }
};

/* ================================================================
   Реклама для подсказки
   ================================================================ */
function watchAdForHint(){
  const btn = document.getElementById('hintWatchAdBtn');
  if (!btn || btn.disabled) return;
  if (!Hints.canWatchAd()) return;
  btn.disabled = true;
  btn.textContent = '⏳ Загрузка...';
  YandexGames.showRewardedVideo(
    () => {
      Hints.grantFromAd();
      UI.updateHintModal();
      AudioManager.playHint();
    },
    () => {
      UI.updateHintModal();
      UI.startHintCooldownTick();
    }
  );
}

/* ================================================================
   ЗАПУСК
   ================================================================ */
document.addEventListener('DOMContentLoaded', async () => {
  // Инициализация SDK и облачных сохранений
  await YandexGames.init();
  await PlayerData.init();
  await PlayerData.load();

  // Применяем сохранённые фон и рубашку
  Shop.apply();

  Game.init();

  // Кнопки главного меню
  document.querySelectorAll('.menu-overlay .menu-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'new-game') { AudioManager.playClick(); Game.newGame(); }
      else if (action === 'rules') UI.showRules();
      else if (action === 'settings') UI.showSettings();
      else if (action === 'records') UI.showRecords();
      else if (action === 'shop') UI.showShop();
      else if (action === 'exit') UI.exitGame();
    });
  });
  // Кнопки победы
  document.querySelectorAll('.win-overlay .menu-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'new-game') { AudioManager.playClick(); UI.hideWinScreen(); Game.newGame(); }
      else if (action === 'records') { UI.showRecords(Settings.difficulty); }
      else if (action === 'go-menu') { UI.hideWinScreen(); UI.goToMenu(); }
    });
  });
  // Кнопки проигрыша
  document.querySelectorAll('.dead-overlay .menu-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      if (action === 'new-game') { AudioManager.playClick(); UI.hideDeadScreen(); Game.newGame(); }
      else if (action === 'undo') { AudioManager.playClick(); Game.undo(); }
      else if (action === 'go-menu') { UI.hideDeadScreen(); UI.goToMenu(); }
    });
  });

  document.getElementById('settingsBtn').addEventListener('click', UI.showSettings);
  document.getElementById('menuBtn').addEventListener('click', UI.goToMenu);

  // Кнопки закрытия модалок
  document.querySelectorAll('.close-btn[data-close]').forEach(btn => {
    btn.addEventListener('click', () => UI.closeModal(btn.dataset.close));
  });
  document.querySelectorAll('.modal-overlay').forEach(o => {
    o.addEventListener('pointerdown', e => {
      if (e.target === o) {
        o.classList.remove('active');
        if (o.id === 'hintModal' && UI._hintTimer) {
          clearInterval(UI._hintTimer); UI._hintTimer = null;
        }
      }
    });
  });

  // Настройки
  const mv = document.getElementById('musicVolume');
  if (mv) mv.addEventListener('input', e => Settings.setMusicVolume(e.target.value));
  const sv = document.getElementById('sfxVolume');
  if (sv) sv.addEventListener('input', e => Settings.setSfxVolume(e.target.value));
  document.querySelectorAll('#drawModeToggle .toggle-btn').forEach(b => {
    b.addEventListener('click', () => Settings.setDrawMode(parseInt(b.dataset.mode)));
  });
  document.querySelectorAll('#difficultyToggle .toggle-btn').forEach(b => {
    b.addEventListener('click', () => Settings.setDifficulty(b.dataset.diff));
  });

  // Табы рекордов
  document.querySelectorAll('#recordsTabs .tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      AudioManager.playClick();
      RecordsUI.render(b.dataset.diff);
    });
  });

  // Табы магазина
  document.querySelectorAll('#shopTabs .tab-btn').forEach(b => {
    b.addEventListener('click', () => {
      AudioManager.playClick();
      ShopUI.render(b.dataset.tab);
    });
  });

  // Кнопка просмотра рекламы за подсказку
  const adBtn = document.getElementById('hintWatchAdBtn');
  if (adBtn) adBtn.addEventListener('click', watchAdForHint);

  // Горячие клавиши
  document.addEventListener('keydown', e => {
    const modalActive = document.querySelector('.modal-overlay.active');
    const overlayActive = document.querySelector('.win-overlay.active, .dead-overlay.active');
    if (e.key === 'Escape') { if (modalActive) modalActive.classList.remove('active'); }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
      if (modalActive) return;
      e.preventDefault();
      Game.undo();
    }
    if (e.key === ' ' || e.key === 'Spacebar') {
      const menuHidden = document.getElementById('menuOverlay').classList.contains('hidden');
      if (!modalActive && !overlayActive && menuHidden) { e.preventDefault(); Game.drawFromStock(); }
    }
    if ((e.key === 'h' || e.key === 'H' || e.key === 'р' || e.key === 'Р') && !modalActive) {
      e.preventDefault();
      Game.useHint();
    }
  });

  // Защита от выделения и контекстного меню
  document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('selectstart', e => e.preventDefault()); // Полностью отключаем выделение

  // Ресайз
  let resizeTimer = null;
  const onResize = () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => Game.rerender(), 150);
  };
  window.addEventListener('resize', onResize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(onResize, 250));
  if (screen.orientation && screen.orientation.addEventListener) {
    screen.orientation.addEventListener('change', () => setTimeout(onResize, 250));
  }

  // Обработка потери фокуса (для звука)
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      AudioManager.pauseAll();
      Game.pauseGame();
    } else {
      if (!YandexGames._isPausedByPlatform) {
        AudioManager.resumeAll();
        Game.resumeGame();
      }
    }
  });
  window.addEventListener('blur', () => {
    AudioManager.pauseAll();
    Game.pauseGame();
  });
  window.addEventListener('focus', () => {
    if (!YandexGames._isPausedByPlatform) {
      AudioManager.resumeAll();
      Game.resumeGame();
    }
  });
});
</script>
